name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  BUILD_CONFIGURATION: Release

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Employee360Integration.sln

      - name: Build
        run: dotnet build Employee360Integration.sln --no-restore --configuration $BUILD_CONFIGURATION

      - name: Test
        run: >
          dotnet test Employee360Integration.sln
          --no-build
          --configuration $BUILD_CONFIGURATION
          --logger "trx;LogFileName=test-results.trx"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx

      - name: Publish API
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: >
          dotnet publish src/Employee360.Integration.Api/Employee360.Integration.Api.csproj
          --no-build
          --configuration $BUILD_CONFIGURATION
          --output publish/api

      - name: Upload API artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: employee360-integration-api
          path: publish/api

  # Next step for a real pipeline: a deploy job per environment (dev/test/prod) that
  # provisions infrastructure with Bicep/Terraform and deploys the published artifact to
  # an Azure Function / App Service, authenticating to Azure via OIDC (azure/login) rather
  # than stored secrets, with GitHub environment protection rules for approvals.
